name: Workflow Secrets Test

on: push

jobs:
  test:
    name: Test
    runs-on: ubuntu-slim
    steps:
      - name: Test step
        env:
          SECRET: ${{ secrets.SECRET }}
        run: |
          printf 'The secret is "%s"\n' "$SECRET"
          printf 'The secret is %s characters long\n' "${#SECRET}"

      - name: Composite action test
        uses: $/.github/actions/composite
        with:
          secret: ${{ secrets.SECRET }}

      - name: JavaScript action test
        uses: $/.github/actions/javascript
        with:
          secret: ${{ secrets.SECRET }}
